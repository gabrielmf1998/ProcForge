<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Ícone original do ProcForge: fundo escuro + árvore de processos + faísca (forja) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3440"/>
      <stop offset="1" stop-color="#1b2028"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="12" fill="url(#bg)" stroke="#3d4a5c" stroke-width="2"/>
  <!-- árvore de processos -->
  <g stroke="#4fc3dc" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M16 16 V48"/>
    <path d="M16 24 H30"/>
    <path d="M16 36 H30"/>
    <path d="M30 36 V44 H40"/>
  </g>
  <g fill="#7fe0f0">
    <circle cx="16" cy="16" r="4"/>
    <circle cx="32" cy="24" r="4"/>
    <circle cx="32" cy="36" r="4"/>
    <circle cx="42" cy="44" r="4"/>
  </g>
  <!-- faísca da forja -->
  <path d="M45 14 l4 8 l8 2 l-6 5 l1.5 8 l-7.5 -4 l-7.5 4 l1.5 -8 l-6 -5 l8 -2 z"
        fill="#ff6b4a" opacity="0.92"/>
</svg>
