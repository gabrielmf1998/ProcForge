<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Fase 1: instalar em /usr/share/dbus-1/system.d/org.procforge.Helper1.conf
     A GUI (usuário comum) fala com o helper; polkit decide cada AÇÃO. -->
<busconfig>
  <policy user="root">
    <allow own="org.procforge.Helper1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.procforge.Helper1"/>
    <allow receive_sender="org.procforge.Helper1"/>
  </policy>
</busconfig>
